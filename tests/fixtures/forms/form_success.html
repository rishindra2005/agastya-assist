<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submission Successful</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f3f4f6;
      margin: 0;
      padding: 2rem;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 80vh;
    }
    .card {
      background: #ffffff;
      padding: 2.5rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      width: 100%;
      text-align: center;
      border-top: 6px solid #16a34a;
    }
    h1 {
      color: #15803d;
      margin-top: 0;
      font-size: 1.75rem;
    }
    p {
      color: #4b5563;
      line-height: 1.5;
    }
    .ref-no {
      background: #f0fdf4;
      border: 1px dashed #86efac;
      padding: 0.75rem;
      border-radius: 4px;
      font-family: monospace;
      font-size: 1.1rem;
      color: #166534;
      margin: 1.5rem 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="success-message">Form submitted</h1>
    <p>Your application has been received and processed successfully.</p>
    <div class="ref-no">
      Acknowledgement Number: <strong>ACK-2026-9876543210</strong>
    </div>
    <p>Please note down this reference number for future correspondence.</p>
  </div>
</body>
</html>

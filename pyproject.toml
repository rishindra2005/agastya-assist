[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agastya-assist"
version = "0.1.0"
description = "Voice-first AI assistant that helps Indian citizens use government websites"
requires-python = ">=3.12"
dependencies = [
    "pydantic",
    "pydantic-settings",
    "httpx",
    "python-dotenv",
    "playwright",
    "claude-agent-sdk",
    "pyyaml",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
]

[tool.hatch.build.targets.wheel]
packages = ["agastya"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: marks tests as live network tests (deselect with '-m \"not live\"')",
    "e2e: marks tests as end-to-end agent tests",
]
testpaths = ["tests"]

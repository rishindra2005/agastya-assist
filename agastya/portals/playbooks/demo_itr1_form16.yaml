steps:
  - "Check uploaded documents using list_documents. If no Form 16 document is present, ask the citizen to upload their Form 16 PDF."
  - "Read the extracted Form 16 document using read_document to obtain all salary, deduction, and TDS details."
  - "Open the replica login page directly with browser_goto {DEMO_BASE}/mock/itr/login.html (do not click the header Login link; login buttons are reserved for the citizen)."
  - "Fill the citizen's PAN in the User ID field and click Continue."
  - "Hand over control to the citizen so they can verify their secure access message, enter their password, and complete OTP verification."
  - "On the dashboard, click File Now, choose Assessment Year 2026-27, Online mode, Individual status, and select ITR-1 Sahaj."
  - "Fill Personal Information, address, and nature of employment from profile."
  - "Fill Gross Total Income with salary breakdown from Form 16: 17(1), 17(2), 17(3), exempt allowances, standard deduction u/s 16(ia), professional tax u/s 16(iii), and savings bank interest."
  - "Fill Total Deductions (80C, 80D, 80TTA) and Tax Paid (TDS on salary: TAN, employer name, income, TDS) from Form 16."
  - "Review the live tax liability calculation, compare the refund or tax payable under both regimes in one spoken sentence, ask the citizen which regime they prefer, and confirm each tab."
  - "Hand over control to the citizen before clicking Proceed to Validation so they can review the preview summary, tick the declaration, and e-verify."
stop_before:
  - "Proceed to Validation"
  - "Proceed to Verification"
  - "e-Verify"
  - "Login"
  - "Sign In"

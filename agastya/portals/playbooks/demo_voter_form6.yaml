  - "Once on Form 6, select State, District, and Assembly Constituency from Section A dependent dropdowns."
  - "Fill applicant personal details in Section B and relative details in Section D from profile."
  - "Enter contact mobile and email in Section E, Aadhaar details in Section F, and gender in Section G."

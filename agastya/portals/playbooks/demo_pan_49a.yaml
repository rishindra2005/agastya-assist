steps:
  - "Open the PAN application portal demo replica landing page at http://127.0.0.1:8000/mock/pan/ and click Apply Online."
  - "Select application type as New PAN - Indian Citizen (Form 49A) and category as INDIVIDUAL."
  - "Fill applicant registration details from the user profile including full name, date of birth, email, and mobile number."
  - "Stop and hand off to the citizen before ticking the consent checkbox and solving the captcha, and wait for token registration."
  - "After [user finished registration], click Continue with PAN Application Form to navigate into Form 49A tabs."
  - "On the Personal Details tab, confirm name printed on card, select gender, and enter father's name and parent card preferences."
  - "Navigate to the Contact & Other Details tab and fill residential address including flat number, street, city, state, and PIN code."
  - "Click Search AO Code, search for the applicant's residential city in the modal table, and select the corresponding Assessing Officer code."
  - "On the Document Details tab, select identity, address, and date-of-birth proof documents and enter the declaration place."
  - "Proceed to the preview summary and stop before clicking Proceed to Payment or Authenticate & Submit so the citizen completes payment and OTP."
stop_before:
  - "Submit"
  - "Proceed to Payment"
  - "Send OTP"
  - "Authenticate & Submit"
